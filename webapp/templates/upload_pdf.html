{% extends "base.html" %}

{% block content %}
<div class="card">
	<h2>Nahrát PDF fakturu</h2>
	<p>Vyberte jedno nebo více PDF s fakturami. Extrakce proběhne po nahrání.</p>
	<p class="muted">Během zpracování prosím nezavírejte okno.</p>
	{% if error %}
		<div class="flash danger">{{ error }}</div>
	{% endif %}
	<form method="post" enctype="multipart/form-data" class="form show-loading" data-loading-message="Probíhá extrakce… prosím nezavírejte okno.">
		<label for="pdf">PDF soubor</label>
		<input id="pdf" name="pdf" type="file" accept="application/pdf" required>
		<button type="submit">Odeslat</button>
	</form>
</div>
{% endblock %}
